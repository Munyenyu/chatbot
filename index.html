<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winas DT Sacco AI Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="chatbot">
<button class="floating-chat" id="floatingChat">
<span class="floating-icon">💬</span>
<span class="floating-text">
<strong>Hello! 👋</strong>
<span>How can I help you today?</span>
</span>
</button>
<div class="chat-window" id="chatWindow">
<div class="chat-header">
<div class="assistant-info">
<div class="assistant-logo">W</div>
<div class="assistant-details">
<h2>Winas DT Sacco Limited</h2>
<p>AI Assistant <span class="online-dot"></span> Online</p>
</div>
</div>
<button class="close-button" id="closeButton">&times;</button>
</div>
<div class="chat-messages" id="chatMessages">
<div class="message-row">
<div class="message-avatar">W</div>
<div class="ai-message">
Hello! 👋
<br><br>
Welcome to Winas DT Sacco Limited AI Assistant.
<br><br>
How can I help you today?
</div>
</div>
</div>
<div class="chat-input-area">
<input type="text" id="messageInput" placeholder="Type your message here..." autocomplete="off">
<button class="send-button" id="sendButton">➤</button>
</div>


<script src="app.js"></script>
</body>
</html>
